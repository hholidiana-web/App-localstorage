
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyLogin App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="card" id="authCard">
      <h1>MyLogin</h1>
      <p class="subtitle">Selamat datang di aplikasi kami</p>

      <div id="loginForm">
        <h2>Login</h2>
        <input type="text" id="loginUser" placeholder="Username">
        <input type="password" id="loginPass" placeholder="Password">
        <button onclick="login()">Masuk</button>
        <p>Belum punya akun?
          <a onclick="showRegister()">Daftar</a>
        </p>
      </div>

      <div id="registerForm" class="hidden">
        <h2>Buat Akun</h2>
        <input type="text" id="regUser" placeholder="Buat Username">
        <input type="password" id="regPass" placeholder="Buat Password">
        <button onclick="register()">Daftar Sekarang</button>
        <p>Sudah punya akun?
          <a onclick="showLogin()">Login</a>
        </p>
      </div>
    </div>

    <div class="card hidden" id="dashboard">
      <h1>Dashboard</h1>
      <h2>Halo, <span id="welcomeUser"></span>!</h2>
      <p>Anda berhasil login.</p>

      <div class="info">
        <h3>Status Akun</h3>
        <p>Login berhasil menggunakan LocalStorage.</p>
      </div>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
